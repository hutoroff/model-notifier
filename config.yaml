# model-notifier config. ${VAR} is expanded from the environment. See AGENTS.md.
interval: 30m            # default poll interval
state_file: /data/state.json
listen: ":8080"

notifiers:
  - name: tg
    type: telegram
    token: ${TG_BOT_TOKEN}
    chat_id: ${TG_CHAT_ID}

providers:
  - name: anthropic
    sources:
      - name: models-overview
        type: webpage
        url: https://platform.claude.com/docs/en/models/overview
        interval: 10m
        items: "//table//tr[th[contains(., 'Claude API ID')]]/td"   # one item per match; Key = normalize-space(text)
        fields:                       # "./..." → relative to item node; otherwise document-wide, zipped by index
          name: "//table/thead//th//a"
          link: "//table/thead//th//a/@href"                        # 'link' field becomes Item.Link, resolved against url
        template: |
          🆕 <b>Anthropic</b> listed a new model: <b>{{.Fields.name}}</b>
          ID: <code>{{.Key}}</code>
          <a href="{{.Link}}">Docs</a>
      - name: python-sdk-releases
        type: github_releases
        url: https://github.com/anthropics/anthropic-sdk-python/releases.atom
        filter: 'claude-[a-z]+-\d[\d-]*'   # regex on title+content; omit → every release
        template: |
          📦 <b>anthropic-sdk-python {{.Fields.title}}</b> adds: <code>{{.Fields.matches}}</code>
          <a href="{{.Link}}">Release notes</a>

  - name: openai
    sources:
      - name: changelog
        type: webpage
        url: https://developers.openai.com/api/docs/changelog
        interval: 10m
        # Model tag badges whose text is gpt-<digit>… (text models only). Class names are build-hashed, so match data-* attributes.
        items: "//main//div[@data-variant='soft'][@data-color='secondary'][starts-with(normalize-space(.),'gpt-')][contains('0123456789',substring(normalize-space(.),5,1))]"
        fields:
          date: "./ancestor::div[contains(@class,'grid')][1]//div[@data-variant='outline']"   # entry date badge, e.g. "Oct 8"
        template: |
          🆕 <b>OpenAI</b> changelog lists a new model: <code>{{.Key}}</code> ({{.Fields.date}})
          <a href="https://developers.openai.com/api/docs/models/{{.Key}}">Docs</a> · <a href="https://developers.openai.com/api/docs/changelog">Changelog</a>
      - name: python-sdk-releases
        type: github_releases
        url: https://github.com/openai/openai-python/releases.atom
        # The "api: …" release line that names a gpt-N model or adds model identifiers/slugs.
        filter: '(?i)api: [^()]*?\b(?:gpt-\d[\w.-]*|model (?:identifier|slug)s?)\b[^()]*'
        template: |
          📦 <b>openai-python {{.Fields.title}}</b>: {{.Fields.matches}}
          <a href="{{.Link}}">Release notes</a>

  - name: google
    sources:
      - name: changelog
        type: webpage
        url: https://ai.google.dev/gemini-api/docs/changelog
        interval: 10m
        # <code> model IDs inside dated entries (h2[@data-text] + following siblings). -latest aliases skipped.
        items: "//h2[@data-text]/following-sibling::ul//code[starts-with(normalize-space(.),'gemini-')][not(contains(.,'-latest'))]"
        fields:
          date: "./preceding::h2[@data-text][1]/@data-text"   # entry date, e.g. "October 8, 2026"
          anchor: "./preceding::h2[@data-text][1]/@id"        # e.g. "10-08-2026"; bare id, so the URL is built in the template
        template: |
          🆕 <b>Google</b> changelog lists a new model: <code>{{.Key}}</code> ({{.Fields.date}})
          <a href="https://ai.google.dev/gemini-api/docs/changelog#{{.Fields.anchor}}">Changelog</a>
      - name: python-sdk-releases
        type: github_releases
        url: https://github.com/googleapis/python-genai/releases.atom
        # "Add …" release line naming a gemini-N id or a Gemini … model(s).
        filter: '(?i)\badd\b[^()]*?(?:gemini-\d[\w.-]*|gemini[- ][^()]*?\bmodels?\b)[^()]*'
        template: |
          📦 <b>python-genai {{.Fields.title}}</b>: {{.Fields.matches}}
          <a href="{{.Link}}">Release notes</a>

  - name: xai
    sources:
      - name: api
        type: webpage
        url: https://x.ai/api
        interval: 1h
        # Model ids in the pricing tables (flagship text model + Imagine). Voice table lists modes, not ids.
        # Mobile cards duplicate the ids outside <table>, so only table cells are matched; text()[1] skips the "New" badge.
        items: "//section[@id='pricing']//table//td[1]//div[starts-with(normalize-space(text()[1]),'grok-')]/text()[1]"
        fields:
          about: "./ancestor::td[1]//p"   # modality ("Text, Image → Video") or flagship blurb
        template: |
          🆕 <b>xAI</b> API page lists a new model: <code>{{.Key}}</code>
          {{.Fields.about}}
          <a href="https://x.ai/api#models">Pricing</a> · <a href="https://docs.x.ai/developers/pricing">Docs</a>
      - name: python-sdk-releases
        type: github_releases
        url: https://github.com/xai-org/xai-sdk-python/releases.atom
        # "Add/Update … to/in <X>Model" release line: new ids land in the ChatModel/ImageGenerationModel types.
        filter: '\b(?i:add|update)\b[^@]*?\b(?:to|in) (?:[A-Z]\w*Model|types/model\.py)\b'
        template: |
          📦 <b>xai-sdk-python {{.Fields.title}}</b>: {{.Fields.matches}}
          <a href="{{.Link}}">Release notes</a>
